server:
  port: 8080

spring:
  application:
    name: hm-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Patient Service
        - id: patient-service
          uri: lb://hm-patient-service
          predicates:
            - Path=/api/v1/patients/**
          filters:
            - name: CircuitBreaker
              args:
                name: patientService
                fallbackUri: forward:/fallback/patient
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@ipKeyResolver}"

        # Appointment Service
        - id: appointment-service
          uri: lb://hm-appointment-service
          predicates:
            - Path=/api/v1/appointments/**,/api/v1/doctors/*/availability,/api/v1/doctors/*/schedule,/api/v1/queue/**

        # OPD Service
        - id: opd-service
          uri: lb://hm-opd-service
          predicates:
            - Path=/api/v1/opd/**

        # Billing Service
        - id: billing-service
          uri: lb://hm-billing-service
          predicates:
            - Path=/api/v1/billing/**,/api/v1/invoices/**,/api/v1/payments/**

        # Master Data Service
        - id: master-data-service
          uri: lb://hm-master-data-service
          predicates:
            - Path=/api/v1/master/**,/api/v1/icd/**,/api/v1/drugs/**,/api/v1/services/**

        # Notification Service
        - id: notification-service
          uri: lb://hm-notification-service
          predicates:
            - Path=/api/v1/notifications/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/hospital

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-secret-2026@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
