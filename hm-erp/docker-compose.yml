# Hospital Management ERP - Local Development Infrastructure
# Usage: docker compose up -d

services:
  # ──────────────── PostgreSQL ────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hm-network

  # ──────────────── Redis ────────────────
  redis:
    image: redis:7-alpine
    container_name: hm-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hm-network

  # ──────────────── Kafka ────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: hm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - hm-network

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: hm-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - hm-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hm-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: hm-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "9080:8080"
    networks:
      - hm-network

  # ──────────────── Keycloak ────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: hm-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - hm-network

  # ──────────────── MinIO (Object Storage) ────────────────
  minio:
    image: minio/minio:latest
    container_name: hm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-admin
      MINIO_ROOT_PASSWORD: minio-secret-2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - hm-network

  # ──────────────── Monitoring: Prometheus ────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: hm-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - hm-network

  # ──────────────── Monitoring: Grafana ────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: hm-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hm-network

  # ──────────────── Mailhog (Email Testing) ────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: hm-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hm-network

  # ──────────────── HM Discovery Server ────────────────
  hm-discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-discovery-server
    container_name: hm-discovery-server
    ports:
      - "8761:8761"
    networks:
      - hm-network

   # ──────────────── HM API Gateway ────────────────
  hm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-gateway
    container_name: hm-gateway
    ports:
      - "8080:8080"
    depends_on:
      - hm-discovery-server
      - redis
      - keycloak
    networks:
      - hm-network

  # ──────────────── HM Patient Service ────────────────
  hm-patient-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-patient-service
    container_name: hm-patient-service
    depends_on:
      - hm-discovery-server
      - postgres
    networks:
      - hm-network

  # ──────────────── HM Master Data Service ────────────────
  hm-master-data-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-master-data-service
    container_name: hm-master-data-service
    depends_on:
      - hm-discovery-server
      - postgres
    networks:
      - hm-network

  # ──────────────── HM Appointment Service ────────────────
  hm-appointment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-appointment-service
    container_name: hm-appointment-service
    depends_on:
      - hm-discovery-server
      - postgres
    networks:
      - hm-network

  # ──────────────── HM OPD Service ────────────────
  hm-opd-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-opd-service
    container_name: hm-opd-service
    depends_on:
      - hm-discovery-server
      - postgres
    networks:
      - hm-network

  # ──────────────── HM Billing Service ────────────────
  hm-billing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-billing-service
    container_name: hm-billing-service
    depends_on:
      - hm-discovery-server
      - postgres
    networks:
      - hm-network

  # ──────────────── HM Notification Service ────────────────
  hm-notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: hm-notification-service
    container_name: hm-notification-service
    depends_on:
      - hm-discovery-server
      - kafka
    networks:
      - hm-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  grafana_data:

networks:
  hm-network:
    driver: bridge
    name: hm-network
